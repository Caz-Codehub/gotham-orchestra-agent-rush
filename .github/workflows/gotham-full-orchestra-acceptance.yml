name: Gotham 4 — Full 12-specialist acceptance
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter RUN_SYNTHETIC_12 to use existing local Qwen CPU on Vultr for one synthetic mission"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gotham-full-orchestra-acceptance
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ inputs.confirmation == 'RUN_SYNTHETIC_12' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gotham-4-0-execution-8f66gu
          persist-credentials: false
      - name: Verify tested script
        run: bash -n scripts/accept_four_orchestras.sh
      - name: Configure existing vetted SSH route
        env:
          DEPLOY_KEY: ${{ secrets.GOTHAM_STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import os,pathlib,base64
          raw=os.environ['DEPLOY_KEY'].strip().lstrip(chr(0xfeff))
          if raw.startswith('-----BEGIN OPENSSH PRIVATE KEY-----') and '\\n' in raw and '\n' not in raw:
              raw=raw.replace('\\n','\n')
          if not raw.startswith('-----BEGIN OPENSSH PRIVATE KEY-----'):
              try:
                  d=base64.b64decode(''.join(raw.split()),validate=True).decode()
                  if d.startswith('-----BEGIN OPENSSH PRIVATE KEY-----'):
                      raw=d
              except (ValueError,UnicodeError):
                  pass
          raw=raw.replace(chr(13),'').strip()+'\n'
          assert raw.startswith('-----BEGIN OPENSSH PRIVATE KEY-----\n') and raw.endswith('\n-----END OPENSSH PRIVATE KEY-----\n')
          pathlib.Path.home().joinpath('.ssh/gotham').write_text(raw)
          PY
          chmod 600 ~/.ssh/gotham
          ssh-keygen -y -P '' -f ~/.ssh/gotham >/dev/null 2>&1
          ssh-keyscan -T 10 -t ed25519 155.138.194.208 2>/dev/null > ~/.ssh/known_hosts
          ACTUAL="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')"
          test "$ACTUAL" = 'SHA256:iCF1uAtKDW1secn8suRBp1y496blYQum9p/EXfXT024' || { echo 'BLOCKED: Vultr host fingerprint mismatch'; exit 1; }
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/gotham -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes gothamdeploy@155.138.194.208 true
      - name: Run actual local Qwen orchestral chain and verify audit
        run: |
          set -euo pipefail
          SCP=(scp -i ~/.ssh/gotham -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SSH=(ssh -i ~/.ssh/gotham -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${SCP[@]}" scripts/accept_four_orchestras.sh gothamdeploy@155.138.194.208:
          "${SSH[@]}" gothamdeploy@155.138.194.208 'bash ./accept_four_orchestras.sh; rc=$?; rm -f ./accept_four_orchestras.sh; exit "$rc"'
      - name: Summarize result
        if: success()
        run: echo "PASS actual local-Qwen 21-task synthetic analysis, Batman-only Specter audit and legacy production preserved. No sandbox/tool execution was claimed." >> "$GITHUB_STEP_SUMMARY"
