name: gotham-unit-and-docker-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Unit and boundary tests
        run: python -m pytest -q -m "not docker"
      - name: Pull constrained sandbox image
        run: docker pull python:3.12-alpine
      - name: Run real Docker containment tests
        env:
          GOTHAM_RUN_DOCKER_TESTS: '1'
        run: python -m pytest -q -m docker
