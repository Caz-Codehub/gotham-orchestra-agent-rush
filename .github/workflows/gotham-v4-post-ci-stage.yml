name: Gotham 4 post-CI auto-stage to Vultr
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gotham-v4-post-ci-stage.yml'
  workflow_run:
    workflows: ["Gotham quality gates"]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: gotham4-staging-update
  cancel-in-progress: false
jobs:
  test-and-stage:
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'claude/gotham-4-0-execution-8f66gu' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'claude/gotham-4-0-execution-8f66gu' || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm immutable branch commit passed both GitHub CI workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Checking source commit $SHA"
          BRANCH_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/claude/gotham-4-0-execution-8f66gu" --jq '.object.sha')"
          test "$SHA" = "$BRANCH_HEAD" || { echo "BLOCKED: obsolete green commit; newer Gotham branch HEAD exists"; exit 1; }
          confirmed=0
          for attempt in $(seq 1 48); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" > /tmp/gotham-ci-runs.json
            if python3 - /tmp/gotham-ci-runs.json <<'PY'
          import json,sys
          runs=json.load(open(sys.argv[1])).get('workflow_runs',[])
          accepted={'Gotham quality gates','gotham-unit-and-docker-tests'}
          ok={x['name'] for x in runs if x.get('conclusion')=='success' and x.get('event') in ('push','pull_request')}
          if accepted <= ok:
              print('PASS: both complete CI gates are green on exact source SHA')
              sys.exit(0)
          print('CI still pending or red; green:', sorted(ok & accepted))
          sys.exit(1)
          PY
            then
              confirmed=1
              break
            fi
            sleep 8
          done
          test "$confirmed" = 1 || { echo "BLOCKED: source commit has not passed both CI gates"; exit 1; }

      - id: ci_tests
        name: Compile and test before any Vultr change
        env:
          GOTHAM_RUN_DOCKER_TESTS: '0'
        run: |
          set -euo pipefail
          bash -n deploy/persistent_stage_nonroot.sh
          python -m compileall -q gotham
          python -m pip install -q -r requirements.txt -r requirements-dev.txt
          python -m pytest -q -ra tests/test_orchestra_durable.py tests/test_gotham_architecture_contract.py tests/test_orchestras.py tests/test_v4_agent_runtime.py tests/test_orchestra_hypotheses.py tests/test_inference_audit_gate.py tests/test_model_policy.py
      - id: ssh_auth
        name: Configure approved rootless SSH
        env:
          DEPLOY_KEY: ${{ secrets.GOTHAM_STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo 'BLOCKED: missing staging SSH credential'; exit 1; }
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import os, pathlib, base64
          raw = os.environ['DEPLOY_KEY'].strip().lstrip(chr(0xfeff))
          if raw.startswith('-----BEGIN OPENSSH PRIVATE KEY-----') and '\\n' in raw and '\n' not in raw:
              raw = raw.replace('\\n', '\n')
          if not raw.startswith('-----BEGIN OPENSSH PRIVATE KEY-----'):
              try:
                  candidate=base64.b64decode(''.join(raw.split()),validate=True).decode()
                  if candidate.startswith('-----BEGIN OPENSSH PRIVATE KEY-----'):
                      raw=candidate
              except (ValueError,UnicodeError):
                  pass
          raw=raw.replace(chr(13),'').strip()+'\n'
          if not (raw.startswith('-----BEGIN OPENSSH PRIVATE KEY-----\n') and raw.endswith('\n-----END OPENSSH PRIVATE KEY-----\n')):
              raise SystemExit('BLOCKED: incomplete SSH credential')
          pathlib.Path.home().joinpath('.ssh/gotham').write_text(raw)
          PY
          chmod 600 ~/.ssh/gotham
          ssh-keygen -y -P '' -f ~/.ssh/gotham > /dev/null 2>&1 || { echo 'BLOCKED: invalid SSH credential'; exit 1; }
          ssh-keyscan -T 10 -t ed25519 155.138.194.208 2>/dev/null > ~/.ssh/known_hosts
          OBSERVED="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk 'NR==1 {print $2}')"
          test "$OBSERVED" = 'SHA256:iCF1uAtKDW1secn8suRBp1y496blYQum9p/EXfXT024' || { echo 'BLOCKED: Vultr fingerprint changed'; exit 1; }
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/gotham -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 gothamdeploy@155.138.194.208 true
      - id: staged_release
        name: Upload checksummed release and update localhost staging
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          git archive --format=tar.gz -o "gotham-v4-$SHA.tar.gz" HEAD
          sha256sum "gotham-v4-$SHA.tar.gz" > "gotham-v4-$SHA.tar.gz.sha256"
          sshopts=(-i ~/.ssh/gotham -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12)
          scp "${sshopts[@]}" "gotham-v4-$SHA.tar.gz" "gotham-v4-$SHA.tar.gz.sha256" gothamdeploy@155.138.194.208:
          ssh "${sshopts[@]}" gothamdeploy@155.138.194.208 "RELEASE_SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME"
          sha256sum -c "gotham-v4-$RELEASE_SHA.tar.gz.sha256"
          TARGET="$HOME/gotham-v4-staging/releases/$RELEASE_SHA"
          if [ ! -d "$TARGET" ]; then
            install -d -m 700 "$TARGET"
            tar -xzf "gotham-v4-$RELEASE_SHA.tar.gz" -C "$TARGET" --no-same-owner --no-same-permissions
          fi
          bash "$TARGET/deploy/persistent_stage_nonroot.sh" "$TARGET"
          rm -f "$HOME/gotham-v4-$RELEASE_SHA.tar.gz" "$HOME/gotham-v4-$RELEASE_SHA.tar.gz.sha256"
          REMOTE
          echo "PASS: release $SHA deployed to protected localhost-only staging; production unchanged" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish nonsecret staging receipt
        if: always()
        env:
          CI_OUTCOME: ${{ steps.ci_tests.outcome }}
          SSH_OUTCOME: ${{ steps.ssh_auth.outcome }}
          STAGING_OUTCOME: ${{ steps.staged_release.outcome }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json,os,datetime
          state = "staging-healthy" if os.environ.get("STAGING_OUTCOME") == "success" else "staging-blocked"
          obj = {
              "state":state,
              "ci_tests":os.environ.get("CI_OUTCOME","unknown"),
              "ssh_auth":os.environ.get("SSH_OUTCOME","unknown"),
              "staging_deploy":os.environ.get("STAGING_OUTCOME","unknown"),
              "deployed_commit":os.environ.get("SOURCE_SHA") or os.popen("git rev-parse HEAD").read().strip(),
              "timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "host":"155.138.194.208",
              "bind":"127.0.0.1:8001",
              "production_modified":False,
              "real_orchestra_mission_verified":False,
              "notes":"Rootless staging health/roster/worker check only; production not promoted."
          }
          with open("gotham-staging-receipt.json","w") as out:
              json.dump(obj,out,indent=2)
          print("Staging status:",state,"CI:",obj["ci_tests"],"SSH:",obj["ssh_auth"],"install:",obj["staging_deploy"])
          PY
      - name: Report remote staging worker diagnostics (no secrets)
        if: ${{ steps.staged_release.outcome == 'success' }}
        run: |
          ssh -i ~/.ssh/gotham -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes gothamdeploy@155.138.194.208 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/gotham-v4-staging"
          echo "Current release: $(readlink -f "$BASE/current")"
          echo "Worker process count:"
          pgrep -af '[p]ython.*gotham.core.orchestra_worker' | sed -E 's@/home/[^ ]+/@~/@g' || true
          echo "Recorded worker PID: $(cat "$BASE/orchestra-worker.pid" 2>/dev/null || echo missing)"
          ACTUAL="$(pgrep -u "$(id -u)" -fc '[p]ython.*gotham.core.orchestra_worker' || true)"
          echo "Restricted worker process count: $ACTUAL"
          test "$ACTUAL" = 1 || { echo "BLOCKED: expected exactly one staging orchestra worker"; exit 1; }
          echo "Configured quota keys (never print tokens):"
          grep -E '^GOTHAM_(MAX_MODEL_CALLS|ORCHESTRA_MISSION_CALL_LIMIT|INFERENCE_PROVIDER|OLLAMA_MODEL)=' "$BASE/staging.env" || true
          cd "$BASE/current"
          "$BASE/current/.venv/bin/python" - <<'PY'
          import inspect
          from gotham.core.orchestra_worker import run
          from gotham.core.model_budget import MissionModelClient
          print("Mission budget adapter loaded:", MissionModelClient.__module__)
          print("Worker factory support:", "client_factory" in inspect.signature(run).parameters)
          assert "client_factory" in inspect.signature(run).parameters
          PY
          REMOTE
      - name: Run one guarded full-orchestra acceptance after confirmed worker repair
        if: ${{ steps.staged_release.outcome == 'success' && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only this explicit workflow-repair commit may dispatch acceptance.
          # Repeated workflow_run events must not launch duplicate missions.
          gh workflow run gotham-v4-post-stage-acceptance.yml --ref main -f confirmation=RUN_SYNTHETIC_12
          echo "Dispatched one 12-specialist real-model acceptance test." >> "$GITHUB_STEP_SUMMARY"
      - name: Save staging receipt as a GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gotham-staging-receipt-${{ github.run_id }}
          path: gotham-staging-receipt.json
          retention-days: 30
          if-no-files-found: warn
