name: Gotham 4 staging release artifact
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gotham-staging-release.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out Gotham 4 staging source (never production branch)
        uses: actions/checkout@v4
        with:
          ref: claude/gotham-4-0-execution-8f66gu
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify staging scripts and Python
        run: |
          bash -n deploy/stage_side_by_side.sh
          python -m compileall -q gotham tests
      - name: Install requirements
        run: python -m pip install -q -r requirements.txt -r requirements-dev.txt
      - name: Run tests excluding Docker-dependent acceptance
        run: python -m pytest -q -ra -m 'not integration'
        env:
          GOTHAM_RUN_DOCKER_TESTS: '0'
      - name: Prepare hashed staging-only bundle
        run: |
          mkdir -p output/staging
          git archive --format=tar HEAD | tar -xf - -C output/staging
          git rev-parse HEAD > output/staging/SOURCE_COMMIT.txt
          tar -C output -czf gotham-v4-staging.tar.gz staging
          sha256sum gotham-v4-staging.tar.gz > gotham-v4-staging.tar.gz.sha256
      - name: Upload release without deploying to Vultr
        uses: actions/upload-artifact@v4
        with:
          name: gotham-v4-staging-${{ github.run_id }}
          path: |
            gotham-v4-staging.tar.gz
            gotham-v4-staging.tar.gz.sha256
          retention-days: 14
