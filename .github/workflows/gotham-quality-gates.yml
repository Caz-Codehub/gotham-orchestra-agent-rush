name: Gotham quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pip-audit
      - name: Compile Python source
        run: |
          python - <<'PY'
          import pathlib, py_compile
          paths = [p for p in pathlib.Path('.').rglob('*.py') if not any(x in p.parts for x in ('.git','.venv','venv'))]
          for path in paths:
              py_compile.compile(str(path), doraise=True)
          print(f"Compiled {len(paths)} Python files")
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Reject committed credential files
        run: |
          python - <<'PY'
          import subprocess,sys
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          bad=[p for p in tracked if p.split('/')[-1] in ('.env','id_rsa','id_ed25519','credentials.json','service-account.json') or p.endswith(('.pem','.key','.p12'))]
          if bad:
              print('Potential secret files tracked:',*bad,sep='\n')
              sys.exit(1)
          print('No common credential filenames tracked')
          PY
