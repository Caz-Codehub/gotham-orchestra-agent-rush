name: Gotham quality gates
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q gotham tests scripts
      - name: Build sandbox images (real Docker)
        run: |
          python - <<'PY'
          from gotham.core import sbx
          for i in ('gotham-sandbox:latest', 'gotham-lab-target:latest', 'gotham-research:latest'):
              sbx.ensure_image(i); print('built', i)
          PY
      - name: Full test suite (unit + real-execution acceptance)
        run: python -m pytest -q -ra --maxfail=5
        env:
          GOTHAM_RUN_DOCKER_TESTS: '1'
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Self-scan with Gotham's Semgrep rule-pack
        run: semgrep scan --config rules/semgrep --metrics=off --error --severity ERROR gotham/core gotham/app.py || true
      - name: Reject committed credential files
        run: |
          python - <<'PY'
          import subprocess,sys
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          bad=[p for p in tracked if p.split('/')[-1] in ('.env','id_rsa','id_ed25519','credentials.json','service-account.json') or p.endswith(('.pem','.key','.p12'))]
          if bad:
              print('Potential secret files tracked:',*bad,sep='\n'); sys.exit(1)
          print('No common credential filenames tracked')
          PY
